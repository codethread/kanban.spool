name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  clojure-test:
    name: Clojure test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: kanban.spool
      # Keep Millstrand unpinned: spool repos are developed against a sibling Millstrand
      # checkout at main, so CI should catch breaking Millstrand changes early. Pin
      # here if that ever proves too noisy.
      - uses: actions/checkout@v4
        with:
          repository: codethread/millstrand
          path: millstrand
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: clojure -M:test
        working-directory: kanban.spool

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: make fmt-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: make lint

  docs-check:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: astral-sh/setup-uv@v8.2.0
      - run: make docs-check

  actionlint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 ./.github/workflows/quality.yml ./.github/workflows/pages.yml

  kanban-dash-check:
    name: Kanban dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: make kanban-dash-check

  identity-check:
    name: Active identity audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make identity-check

  quality-gate:
    name: Quality gate
    needs: [clojure-test, format-check, lint, docs-check, actionlint, kanban-dash-check, identity-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.clojure-test.result }}" != failure
          test "${{ needs.format-check.result }}" != failure
          test "${{ needs.lint.result }}" != failure
          test "${{ needs.docs-check.result }}" != failure
          test "${{ needs.actionlint.result }}" != failure
          test "${{ needs.kanban-dash-check.result }}" != failure
          test "${{ needs.identity-check.result }}" != failure
