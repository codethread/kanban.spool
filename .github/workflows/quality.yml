name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  clojure-test:
    name: Clojure test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: clojure -M:test

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: make fmt-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: make lint

  docs-check:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: astral-sh/setup-uv@v8.2.0
      - run: make docs-check

  quality-gate:
    name: Quality gate
    needs: [clojure-test, format-check, lint, docs-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.clojure-test.result }}" != failure
          test "${{ needs.format-check.result }}" != failure
          test "${{ needs.lint.result }}" != failure
          test "${{ needs.docs-check.result }}" != failure
